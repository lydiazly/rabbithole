[project]
name = "mochi-dash"
version = "0.1.0"
description = "An endless runner with a squash-and-stretch mochi bounce"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5"]

[project.scripts]
mochi-dash = "mochi_dash.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# A ROS install on PYTHONPATH leaks its pytest plugins into this venv, and they
# crash on collection. Nothing here uses them. Harmless where ROS is absent.
addopts = "-p no:launch_testing -p no:launch_ros"
